name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
      GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build and install condensed-data
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/parttimenerd/condensed-data.git /tmp/condensed-data
          cd /tmp/condensed-data
          mvn -q install -Dmaven.test.skip=true -P'!jmc-test'

      - name: Build and install jfrtofp
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/parttimenerd/jfrtofp.git /tmp/jfrtofp
          cd /tmp/jfrtofp
          chmod +x gradlew
          ./gradlew publishToMavenLocal -x test -x installCondensedData

      - name: Build Plugin (full, with Jeffrey)
        run: ./gradlew buildPlugin -PincludeJeffrey=true

      - name: Rename full ZIP
        run: |
          cd build/distributions
          for f in *.zip; do mv "$f" "${f%.zip}-full.zip"; done

      - name: Build Plugin (slim, without Jeffrey)
        run: ./gradlew buildPlugin -PincludeJeffrey=false

      - name: Rename slim ZIP
        run: |
          cd build/distributions
          for f in *.zip; do [[ "$f" != *-full.zip ]] && mv "$f" "${f%.zip}-slim.zip"; done

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Extract changelog for this version
        id: changelog
        run: |
          version="${{ steps.version.outputs.version }}"
          awk -v ver="$version" '
            /^## \[/ { if (found) exit; if (index($0, "["ver"]")) found=1; next }
            found { print }
          ' CHANGELOG.md > _changelog.txt
          echo 'notes<<EOF' >> $GITHUB_OUTPUT
          cat _changelog.txt >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ steps.version.outputs.version }}
          body: |
            ## Installation

            **From JetBrains Marketplace:** search for *Java JFR Profiler* in Settings → Plugins.

            **Manual install:** download a ZIP below and use *Settings → Plugins → ⚙ → Install Plugin from Disk*.

            Two variants:
            - **-full.zip** — includes the Jeffrey profiler viewer (requires JDK 25+)
            - **-slim.zip** — without Jeffrey (~145 MB smaller)

            ## Changelog

            ${{ steps.changelog.outputs.notes }}
          files: |
            build/distributions/*.zip
