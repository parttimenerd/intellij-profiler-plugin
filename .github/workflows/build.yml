# GitHub Actions Workflow is created for testing and preparing the plugin release in the following steps:
# - validate Gradle Wrapper,
# - run 'test' and 'verifyPlugin' tasks,
# - run Qodana inspections,
# - run 'buildPlugin' task and prepare artifact for the further tests,
# - run 'runPluginVerifier' task,
# - create a draft release.
#
# Workflow is triggered on push and pull_request events.
#
# GitHub Actions reference: https://help.github.com/en/actions
#
## JBIJPPTPL

name: Build
on:
  # Trigger the workflow on pushes to only the 'main' branch (this avoids duplicate checks being run e.g. for dependabot pull requests)
  push:
    branches: [main]
  # Trigger the workflow on any pull request
  pull_request:

jobs:

  # Run Gradle Wrapper Validation Action to verify the wrapper's checksum
  # Run verifyPlugin, IntelliJ Plugin Verifier, and test Gradle tasks
  # Build plugin and provide the artifact for the next workflow jobs
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.properties.outputs.version }}
      changelog: ${{ steps.properties.outputs.changelog }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
      GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
    steps:

      # Check out current repository
      - name: Fetch Sources
        uses: actions/checkout@v4

      # Setup Java 21 environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Build condensed-data from source and install to mavenLocal
      - name: Build and install condensed-data
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/parttimenerd/condensed-data.git /tmp/condensed-data
          cd /tmp/condensed-data
          mvn -q install -Dmaven.test.skip=true -P'!jmc-test'

      # Build jfrtofp from source and install to mavenLocal
      - name: Build and install jfrtofp
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/parttimenerd/jfrtofp.git /tmp/jfrtofp
          cd /tmp/jfrtofp
          chmod +x gradlew
          ./gradlew publishToMavenLocal -x test -x installCondensedData

      # Set environment variables
      - name: Export Properties
        id: properties
        shell: bash
        run: |
          PROPERTIES="$(./gradlew properties --console=plain -q)"
          VERSION="$(echo "$PROPERTIES" | grep "^version:" | cut -f2- -d ' ')"
          NAME="$(echo "$PROPERTIES" | grep "^pluginName:" | cut -f2- -d ' ')"
          CHANGELOG="$(./gradlew getChangelog --unreleased --no-header --console=plain -q)"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "pluginVerifierHomeDir=~/.pluginVerifier" >> $GITHUB_OUTPUT
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          ./gradlew printProductsReleases # prepare list of IDEs for Plugin Verifier

      # Run tests
      - name: Run Tests
        run: ./gradlew check

      # Collect Tests Result of failed tests
      - name: Collect Tests Result
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: tests-result
          path: ${{ github.workspace }}/build/reports/tests

      # Upload Kover report to CodeCov
      #- name: Upload Code Coverage Report
      #  uses: codecov/codecov-action@v3
      #  with:
      #    files: ${{ github.workspace }}/build/reports/kover/xml/report.xml

      # Cache Plugin Verifier IDEs
      #- name: Setup Plugin Verifier IDEs Cache
      #  uses: actions/cache@v3
      #  with:
      #    path: ${{ steps.properties.outputs.pluginVerifierHomeDir }}/ides
      #   key: plugin-verifier-${{ hashFiles('build/printProductsReleases.txt') }}

      # Run Verify Plugin task and IntelliJ Plugin Verifier tool
      #- name: Run Plugin Verification tasks
      #  run: ./gradlew runPluginVerifier -Pplugin.verifier.home.dir=${{ steps.properties.outputs.pluginVerifierHomeDir }}

      # Collect Plugin Verifier Result
      #- name: Collect Plugin Verifier Result
      #  if: ${{ always() }}
      #  uses: actions/upload-artifact@v5
      #  with:
      #    name: pluginVerifier-result
      #    path: ${{ github.workspace }}/build/reports/pluginVerifier

      # Run Qodana inspections
      # - name: Qodana - Code Inspection
      #   uses: JetBrains/qodana-action@v2022.3.0

      # Build the plugin and prepare the artifact for the next steps
      - name: Build Plugin (full, with Jeffrey)
        run: ./gradlew buildPlugin -PincludeJeffrey=true

      - name: Rename full ZIP
        shell: bash
        run: |
          cd build/distributions
          for f in *.zip; do mv "$f" "${f%.zip}-full.zip"; done

      - name: Build Plugin (slim, without Jeffrey)
        run: ./gradlew buildPlugin -PincludeJeffrey=false

      - name: Rename slim ZIP
        shell: bash
        run: |
          cd build/distributions
          for f in *.zip; do [[ "$f" != *-full.zip ]] && mv "$f" "${f%.zip}-slim.zip"; done

      # Prepare plugin archive content for creating artifact
      - name: Prepare Plugin Artifact
        id: artifact
        shell: bash
        run: |
          cd ${{ github.workspace }}/build/distributions
          FILENAME=$(ls *-full.zip | head -1)
          echo "filename=${FILENAME:0:-4}" >> $GITHUB_OUTPUT

      # Store already-built plugin as an artifact for downloading
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.artifact.outputs.filename }}
          path: ./build/distributions/*.zip

  # Prepare a draft release for GitHub Releases page for the manual verification
  # If accepted and published, release workflow would be triggered
  releaseDraft:
    name: Release Draft
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      # Check out current repository
      - name: Fetch Sources
        uses: actions/checkout@v4

      # Remove old release drafts by using the curl request for the available releases with a draft flag
      - name: Remove Old Release Drafts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/{owner}/{repo}/releases \
            --jq '.[] | select(.draft == true) | .id' \
            | xargs -I '{}' gh api -X DELETE repos/{owner}/{repo}/releases/{}