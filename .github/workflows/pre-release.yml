name: Pre-Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  pre-release:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
      GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract pluginVersion from gradle.properties
        id: get_version
        run: |
          version=$(grep '^pluginVersion' gradle.properties | cut -d'=' -f2 | xargs)
          echo "pluginVersion=$version" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build and install condensed-data
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/parttimenerd/condensed-data.git /tmp/condensed-data
          cd /tmp/condensed-data
          mvn -q install -Dmaven.test.skip=true -P'!jmc-test'

      - name: Build and install jfrtofp
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/parttimenerd/jfrtofp.git /tmp/jfrtofp
          cd /tmp/jfrtofp
          chmod +x gradlew
          ./gradlew publishToMavenLocal -x test -x installCondensedData

      - name: Build Plugin (full, with Jeffrey)
        run: ./gradlew buildPlugin -PincludeJeffrey=true

      - name: Rename full ZIP
        run: |
          cd build/distributions
          for f in *.zip; do mv "$f" "${f%.zip}-full.zip"; done

      - name: Build Plugin (slim, without Jeffrey)
        run: ./gradlew buildPlugin -PincludeJeffrey=false

      - name: Rename slim ZIP
        run: |
          cd build/distributions
          for f in *.zip; do [[ "$f" != *-full.zip ]] && mv "$f" "${f%.zip}-slim.zip"; done

      - name: Publish Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          tag_name: "latest"
          prerelease: true
          name: "Development Build ${{ steps.get_version.outputs.pluginVersion }}"
          body: |
            Development build of version ${{ steps.get_version.outputs.pluginVersion }}.

            Two variants:
            - **-full.zip**: includes the Jeffrey profiler viewer (requires JDK 25+ to use Jeffrey)
            - **-slim.zip**: without Jeffrey (~145 MB smaller)

            Install via "Install Plugin from Disk" in your IDE settings.
          files: |
            LICENSE
            build/distributions/*.zip
