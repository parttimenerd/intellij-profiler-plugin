name: Pre-Release (only if version did not change)

on:
  push:
    branches:
      - main

jobs:
  pre-release:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract pluginVersion from gradle.properties
        id: get_version
        run: |
          version=$(grep '^pluginVersion' gradle.properties | cut -d'=' -f2 | xargs)
          echo "pluginVersion=$version" >> $GITHUB_OUTPUT

      - name: Fetch latest tag
        id: get_tag
        run: |
          git fetch --tags
          latest_tag=$(git tag --list 'v*' --sort=-v:refname | head -n1 | sed 's/^v//')
          echo "latest_tag=$latest_tag" >> $GITHUB_OUTPUT

      - name: Check if version matches latest tag
        id: check_version
        run: |
          if [ "${{ steps.get_version.outputs.pluginVersion }}" = "${{ steps.get_tag.outputs.latest_tag }}" ]; then
            echo "Version ${{ steps.get_version.outputs.pluginVersion }} already tagged — skipping pre-release."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "New version ${{ steps.get_version.outputs.pluginVersion }} (latest tag: ${{ steps.get_tag.outputs.latest_tag }}) — building pre-release."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Java
        if: steps.check_version.outputs.skip == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Plugin (full, with Jeffrey)
        if: steps.check_version.outputs.skip == 'false'
        run: ./gradlew buildPlugin -PincludeJeffrey=true

      - name: Rename full ZIP
        if: steps.check_version.outputs.skip == 'false'
        run: |
          cd build/distributions
          for f in *.zip; do mv "$f" "${f%.zip}-full.zip"; done

      - name: Build Plugin (slim, without Jeffrey)
        if: steps.check_version.outputs.skip == 'false'
        run: ./gradlew buildPlugin -PincludeJeffrey=false

      - name: Rename slim ZIP
        if: steps.check_version.outputs.skip == 'false'
        run: |
          cd build/distributions
          for f in *.zip; do [[ "$f" != *-full.zip ]] && mv "$f" "${f%.zip}-slim.zip"; done

      - name: Publish Pre-Release
        if: steps.check_version.outputs.skip == 'false'
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: true
          title: "Development Build ${{ steps.get_version.outputs.pluginVersion }}"
          body: |
            Development build of version ${{ steps.get_version.outputs.pluginVersion }}.

            Two variants:
            - **-full.zip**: includes the Jeffrey profiler viewer (requires JDK 25+ to use Jeffrey)
            - **-slim.zip**: without Jeffrey (~145 MB smaller)

            Install via "Install Plugin from Disk" in your IDE settings.
          files: |
            LICENSE
            build/distributions/*.zip
